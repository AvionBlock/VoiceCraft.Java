plugins {
    id 'fabric-loom' version '1.17.12'
}

import groovy.json.JsonSlurper

description = 'Fabric adapter for VoiceCraft.Java.'
def pluginVersion = project.version.toString()
def targetCatalog = new JsonSlurper().parse(rootProject.file('gradle/voice-targets.json'))
def globalTargetName = providers.gradleProperty('voiceTarget').orNull
def requestedTargetName = providers.gradleProperty('fabricTarget').orNull ?:
        (targetCatalog.any { it.name == globalTargetName && it.loader == 'fabric' } ? globalTargetName : '1.21.11-fabric')
def selectedTarget = targetCatalog.find { it.name == requestedTargetName }
if (selectedTarget == null) {
    throw new GradleException("Unknown VoiceCraft target '${requestedTargetName}'. See gradle/voice-targets.json.")
}
def minecraftVersion = providers.gradleProperty('mcVersion').orElse(selectedTarget.minecraft.toString()).get()
def fabricLoaderVersion = providers.gradleProperty('fabricLoaderVersion').orElse(selectedTarget.fabricLoader.toString()).get()
def fabricApiVersion = providers.gradleProperty('fabricApiVersion').orElse(selectedTarget.fabricApi.toString()).get()
def fabricPermissionsVersion = providers.gradleProperty('fabricPermissionsVersion').orElse(selectedTarget.fabricPermissions.toString()).get()
def minecraftDependency = providers.gradleProperty('minecraftDependency').orElse(selectedTarget.minecraftDependency.toString()).get()
def minecraftArchiveVersion = minecraftVersion.replaceAll('[^A-Za-z0-9._-]', '_')
def targetJavaVersion = providers.gradleProperty('targetJavaVersion').orElse(selectedTarget.java.toString()).get().toInteger()
def simpleVoiceChatAvailable = selectedTarget.simpleVoiceChat as boolean
def plasmoVoiceAvailable = selectedTarget.plasmoVoice as boolean

sourceSets.main.java.srcDir(rootProject.file('modules/mod-runtime/src/main/java'))

java {
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
    if (targetJavaVersion > 21) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    modImplementation "me.lucko:fabric-permissions-api:${fabricPermissionsVersion}"

    implementation project(':core')
    implementation project(':adapter-api')
    modCompileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.20'
    modCompileOnly 'su.plo.voice.api:server:2.1.15'
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.yaml:snakeyaml:2.4'
    implementation 'net.kyori:adventure-api:4.25.0'

    include project(':core')
    include project(':adapter-api')
    include 'com.google.code.gson:gson:2.13.2'
    include 'org.yaml:snakeyaml:2.4'
    include 'net.kyori:adventure-api:4.25.0'
    include "me.lucko:fabric-permissions-api:${fabricPermissionsVersion}"
}

processResources {
    inputs.properties([
        version            : pluginVersion,
        description        : rootProject.description,
        minecraftDependency: minecraftDependency,
        fabricLoaderVersion: fabricLoaderVersion,
        fabricApiVersion   : fabricApiVersion,
        targetName         : requestedTargetName,
        simpleVoiceChatAvailable: simpleVoiceChatAvailable,
        plasmoVoiceAvailable: plasmoVoiceAvailable,
        targetJavaVersion  : targetJavaVersion
    ])

    filesMatching('fabric.mod.json') {
        expand(
            version: pluginVersion,
            description: rootProject.description,
            minecraftDependency: minecraftDependency,
            fabricLoaderVersion: fabricLoaderVersion,
            fabricApiVersion: fabricApiVersion,
            targetJavaVersion: targetJavaVersion
        )
    }
    filesMatching('voicecraft-target.properties') {
        expand(
            targetName: requestedTargetName,
            minecraftVersion: minecraftVersion,
            simpleVoiceChatAvailable: simpleVoiceChatAvailable,
            plasmoVoiceAvailable: plasmoVoiceAvailable
        )
    }
}

tasks.jar {
    archiveBaseName.set("${rootProject.ext.pluginName}-fabric")
    archiveClassifier.set("${minecraftArchiveVersion}-thin")
}

tasks.remapJar {
    archiveBaseName.set("${rootProject.ext.pluginName}-fabric")
    archiveClassifier.set(minecraftArchiveVersion)
}

tasks.build {
    dependsOn tasks.remapJar
}

tasks.register('verifyFabricMetadata') {
    dependsOn tasks.processResources
    def metadataFile = layout.buildDirectory.file('resources/main/fabric.mod.json')
    inputs.file(metadataFile)
    inputs.property('expectedVersion', pluginVersion)

    doLast {
        def metadata = metadataFile.get().asFile.text
        if (!metadata.contains("\"version\": \"${pluginVersion}\"")) {
            throw new GradleException("Fabric fabric.mod.json version does not match ${pluginVersion}.")
        }
    }
}

tasks.check {
    dependsOn tasks.verifyFabricMetadata
}

tasks.register('printFabricTarget') {
    doLast {
        println("Fabric target:")
        println("  minecraft=${minecraftVersion}")
        println("  mappings=official Mojang")
        println("  loader=${fabricLoaderVersion}")
        println("  fabric-api=${fabricApiVersion}")
        println("  fabric-permissions-api=${fabricPermissionsVersion}")
        println("  metadata minecraft=${minecraftDependency}")
        println("  java=${targetJavaVersion}")
        println("  target=${requestedTargetName}")
        println("  simple-voice-chat=${simpleVoiceChatAvailable}")
        println("  plasmo=${plasmoVoiceAvailable}")
    }
}
