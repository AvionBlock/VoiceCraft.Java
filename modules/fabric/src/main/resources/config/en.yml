config-version: 3

config:
  debug: false
  lang: "system"
  auto-reconnect: true

  proxy:
    enabled: false               # Enable when this Fabric server is behind Velocity/Bungee
    server-name: ""              # Must match the server name in Velocity when enabled

  adapters:
    client-priority: ["simple-voice-chat", "plasmo"]
    managed-dependencies:
      enabled: true
    native-configs:
      owner: "voicecraft"
      simple-voice-chat:
        bind-address: ""
        bind-port: 24454
        advertised-host: ""
        advertised-port: 24454
      plasmo:
        bind-address: "0.0.0.0"
        bind-port: 0
        advertised-host: "0.0.0.0"
        advertised-port: 0
    simple-voice-chat:
      enabled: false
      install:
        enabled: true
    plasmo:
      enabled: false
      install:
        enabled: true

  voicecraft:
    transport:
      host: "127.0.0.1"
      port: 9050
      login-token: "__GENERATED_LOGIN_TOKEN__"
    voice:
      port: 9050
    auto-start: true
    shutdown-on-disable: true
    invariant-globalization: true
    ready-timeout-ms: 20000
    install-directory: "voicecraft-runtime"

  voice:
    proximity-distance: 30
    proximity-toggle: true
    voice-effects: true
    send-voicecraft-disconnect-message: true
    send-connection-lost-message: true
    position-update-interval-ticks: 5
