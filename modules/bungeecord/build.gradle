plugins {
    id 'com.gradleup.shadow' version '9.4.3'
}

description = 'BungeeCord proxy runtime, VoiceCraft connection, and UDP relay for VoiceCraft.Java.'
def pluginVersion = project.version.toString()

dependencies {
    implementation project(':core')
    compileOnly 'net.md-5:bungeecord-api:26.1-R0.1-SNAPSHOT'
    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'
}

processResources {
    inputs.properties([
        name       : rootProject.ext.pluginName,
        version    : pluginVersion,
        description: rootProject.description,
        url        : rootProject.ext.pluginUrl,
        author     : rootProject.ext.pluginAuthor
    ])

    filesMatching('bungee.yml') {
        expand(
            name: rootProject.ext.pluginName,
            version: pluginVersion,
            description: rootProject.description,
            url: rootProject.ext.pluginUrl,
            author: rootProject.ext.pluginAuthor
        )
    }
}

tasks.jar {
    archiveBaseName.set("${rootProject.ext.pluginName}-bungeecord")
    archiveClassifier.set('thin')
}

tasks.shadowJar {
    archiveBaseName.set("${rootProject.ext.pluginName}-bungeecord")
    archiveClassifier.set('')
}

tasks.build {
    dependsOn tasks.shadowJar
}

tasks.register('verifyPluginMetadata') {
    dependsOn tasks.processResources
    def metadataFile = layout.buildDirectory.file('resources/main/bungee.yml')
    inputs.file(metadataFile)
    inputs.property('expectedVersion', pluginVersion)

    doLast {
        def metadata = metadataFile.get().asFile.text
        if (!metadata.contains("version: ${pluginVersion}")) {
            throw new GradleException("BungeeCord bungee.yml version does not match ${pluginVersion}.")
        }
    }
}

tasks.check {
    dependsOn tasks.verifyPluginMetadata
}
