plugins {
    id 'com.gradleup.shadow' version '9.4.3'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

description = 'Velocity adapter for VoiceCraft.Java.'

dependencies {
    implementation project(':core')
    implementation 'org.spongepowered:configurate-yaml:4.2.0'
    compileOnly('com.velocitypowered:velocity-api:3.4.0-SNAPSHOT')
    annotationProcessor('com.velocitypowered:velocity-api:3.4.0-SNAPSHOT')
    compileOnly('org.projectlombok:lombok:1.18.44')
    annotationProcessor('org.projectlombok:lombok:1.18.44')
}

processResources {
    inputs.properties([
        id         : 'voicecraft-java',
        name       : rootProject.ext.pluginName,
        version    : project.version,
        description: rootProject.description,
        author     : rootProject.ext.pluginAuthor
    ])

    filesMatching('velocity-plugin.json') {
        expand(
            id: 'voicecraft-java',
            name: rootProject.ext.pluginName,
            version: project.version,
            description: rootProject.description,
            author: rootProject.ext.pluginAuthor
        )
    }
}

tasks.register('patchVelocityPluginJson') {
    dependsOn tasks.compileJava
    inputs.file(layout.buildDirectory.file('classes/java/main/velocity-plugin.json'))
    inputs.property('version', project.version.toString())
    inputs.property('description', rootProject.description)
    inputs.property('author', rootProject.ext.pluginAuthor)
    outputs.file(layout.buildDirectory.file('classes/java/main/velocity-plugin.json'))

    doLast {
        def pluginJsonFile = layout.buildDirectory.file('classes/java/main/velocity-plugin.json').get().asFile
        if (!pluginJsonFile.exists()) {
            throw new GradleException("Velocity plugin metadata was not generated: ${pluginJsonFile}")
        }

        def metadata = new JsonSlurper().parse(pluginJsonFile)
        metadata.version = project.version.toString()
        metadata.description = rootProject.description
        metadata.authors = [rootProject.ext.pluginAuthor]
        pluginJsonFile.text = JsonOutput.toJson(metadata)
    }
}

tasks.jar {
    dependsOn tasks.patchVelocityPluginJson
    archiveBaseName.set("${rootProject.ext.pluginName}-velocity")
    archiveClassifier.set('thin')
}

tasks.shadowJar {
    dependsOn tasks.patchVelocityPluginJson
    archiveBaseName.set("${rootProject.ext.pluginName}-velocity")
    archiveClassifier.set('')
}

tasks.build {
    dependsOn tasks.shadowJar
}
