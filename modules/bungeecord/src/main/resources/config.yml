config-version: 3 # DO NOT EDIT: used for automatic config migrations

config:
  debug: false
  lang: "system"
  auto-reconnect: true

  voicecraft:
    transport:
      host: "127.0.0.1"
      port: 9050
      login-token: "__GENERATED_LOGIN_TOKEN__"
    voice:
      port: 1111

  voice:
    proximity-distance: 30
    proximity-toggle: true
    voice-effects: true

    send-voicecraft-disconnect-message: true # Show a message when the VoiceCraft connection closes
    send-connection-lost-message: true # Show a message when the VoiceCraft connection is lost
    position-update-interval-ticks: 5

  adapters:
    plasmo:
      proxy:
        enabled: false # Enable Plasmo Voice UDP relay on this proxy
        bind-host: "0.0.0.0" # UDP bind address for Plasmo clients
        port: 24454 # Public UDP relay port advertised by Paper public.port
    simple-voice-chat:
      proxy:
        enabled: false # Enable Simple Voice Chat UDP relay on this proxy
        bind-host: "0.0.0.0" # UDP bind address for Simple Voice Chat clients
        port: 24455 # Public UDP relay port advertised by Paper public.port
