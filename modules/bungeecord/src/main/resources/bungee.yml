name: VoiceCraft.Java
version: 0.1.0-SNAPSHOT
main: team.avion.bungeecord.VoiceCraftJava
description: Java-side VoiceCraft bridge with Paper adapters, proxy networking, and managed runtime support.
author: lil-jon-crunk
website: https://java.voicecraft.chat

commands:
  voice:
    permission: voice.cmd

permissions:
  voice.cmd:
    default: true
  voice.connect:
    default: op
  voice.reconnect:
    default: op
  voice.disconnect:
    default: op
  voice.bind:
    default: true
  voice.bindfake:
    default: op
  voice.reload:
    default: op
