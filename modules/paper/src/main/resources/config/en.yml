config-version: 8 # DO NOT EDIT: used for automatic config migrations

config:
  debug: false                   # Enable additional debug logging
  lang: "system"                 # system, en, ru, nl, ja
  auto-reconnect: true           # Reconnect to VoiceCraft after a dropped connection

  proxy:
    enabled: false               # Enable when this Paper server is behind Velocity/Bungee

  adapters:
    client-priority: ["simple-voice-chat", "plasmo"] # Preferred client when a player has both mods
    managed-dependencies:
      enabled: true              # Download missing official server plugins from Modrinth; restart required
    plasmo:
      enabled: false             # Bridge the official Plasmo Voice plugin through VoiceCraft
      install:
        enabled: true            # Install Plasmo Voice automatically when missing
    simple-voice-chat:
      enabled: false             # Bridge the official Simple Voice Chat plugin through VoiceCraft
      install:
        enabled: true            # Install Simple Voice Chat automatically when missing

  voicecraft:
    transport:
      host: "127.0.0.1"          # VoiceCraft TCP host
      port: 9050                 # VoiceCraft TCP port
      login-token: "__GENERATED_LOGIN_TOKEN__" # VoiceCraft LoginToken
    voice:
      port: 1111                 # Managed VoiceCraft voice port
    auto-start: true             # Start managed VoiceCraft automatically
    shutdown-on-disable: true    # Stop managed VoiceCraft when the plugin disables
    invariant-globalization: true # Run .NET without system ICU packages
    ready-timeout-ms: 20000      # How long to wait for VoiceCraft startup
    install-directory: "voicecraft-runtime" # Folder for downloaded VoiceCraft binaries

  voice:
    proximity-distance: 30       # Maximum voice distance
    proximity-toggle: true       # Enable proximity processing
    voice-effects: true          # Enable cave/water voice effects

    vanilla-status-overlay:
      enabled: true                    # Show statuses to and above players without SVC or Plasmo
      update-interval-ticks: 5         # Overlay visibility and position refresh interval
      handshake-grace-ticks: 60        # Wait for mod channels before treating a client as vanilla
      speaking-hold-ms: 600            # Keep speaking state after the latest audio frame
      height-offset: 2.55              # Hologram height above player feet
      view-distance: 48                # Maximum overlay visibility distance
      symbols:
        disconnected: "×"
        connected: "○"
        speaking: "●"
        muted: "M"
        deafened: "D"
      colors:
        disconnected: "dark_gray"
        connected: "gray"
        speaking: "green"
        muted: "red"
        deafened: "yellow"

    send-voicecraft-disconnect-message: true # Show a message when the VoiceCraft connection closes
    send-connection-lost-message: true # Show a message when the VoiceCraft connection is lost
    position-update-interval-ticks: 5 # Position update interval in ticks
    cave-scan-interval-ms: 1000 # Minimum time before recalculating one player's cave factor
    cave-scans-per-update: 2 # Maximum expensive cave scans per position update
