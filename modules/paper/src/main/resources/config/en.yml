config:
  debug: false                   # Enable additional debug logging
  lang: "system"                 # system, en, ru, nl, ja
  auto-reconnect: true           # Reconnect to VoiceCraft after a dropped connection

  proxy:
    enabled: false               # Enable when this Paper server is behind Velocity/Bungee

  adapters:
    plasmo:
      enabled: false             # Enable Plasmo Voice client compatibility
      bind-host: "0.0.0.0"       # UDP bind address for Plasmo clients
      port: 24454                # UDP port for Plasmo clients
      public:
        host: "0.0.0.0"          # Host sent to Plasmo clients; 0.0.0.0 means Minecraft server host
        port: 0                  # Port sent to Plasmo clients; 0 uses the UDP port above
    simple-voice-chat:
      enabled: false             # Enable Simple Voice Chat client compatibility
      bind-host: "0.0.0.0"       # UDP bind address for Simple Voice Chat clients
      port: 24454                # UDP port for Simple Voice Chat clients
      public:
        host: ""                 # Voice host sent to clients; empty means Minecraft server host
        port: 0                  # Port sent to clients; 0 uses the UDP port above
      compatibility-version: 20  # Simple Voice Chat compatibility version
      mtu-size: 1024             # Maximum incoming Opus payload size
      keep-alive-ms: 1000        # UDP keep-alive interval
      allow-recording: true      # Tell clients whether recording is allowed

  voicecraft:
    transport:
      host: "127.0.0.1"          # VoiceCraft TCP host
      port: 9050                 # VoiceCraft TCP port
      login-token: "__GENERATED_LOGIN_TOKEN__" # VoiceCraft LoginToken
    voice:
      port: 1111                 # Managed VoiceCraft voice port
    auto-start: true             # Start managed VoiceCraft automatically
    shutdown-on-disable: true    # Stop managed VoiceCraft when the plugin disables
    invariant-globalization: true # Run .NET without system ICU packages
    ready-timeout-ms: 20000      # How long to wait for VoiceCraft startup
    install-directory: "voicecraft-runtime" # Folder for downloaded VoiceCraft binaries

  voice:
    proximity-distance: 30       # Maximum voice distance
    proximity-toggle: true       # Enable proximity processing
    voice-effects: true          # Enable cave/water voice effects

    not-in-voice-symbol: "\u2727" # Placeholder symbol when a player is not linked
    in-voice-symbol: "\u2726"     # Placeholder symbol when a player is linked

    send-bind-message: true           # Show a message when a player links to VoiceCraft
    send-disconnect-message: true     # Show a message when a player leaves voice chat
    send-voicecraft-disconnect-message: true # Show a message when the VoiceCraft connection closes
    send-connection-lost-message: true # Show a message when the VoiceCraft connection is lost
    position-update-interval-ticks: 5 # Position update interval in ticks
