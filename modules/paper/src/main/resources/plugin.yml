name: VoiceCraft.Java

version: ${version}

main: team.avion.paper.VoiceCraftJava
description: VoiceCraft.Java — the ultimate cross-client proximity voice chat plugin connecting VoiceCraft, Simple Voice Chat, and Plasmo Voice across Java and Bedrock.

author: lil-jon-crunk
website: https://java.voicecraft.chat

api-version: "1.20"
prefix: VoiceCraft.Java
softdepend: [voicechat, PlasmoVoice]

commands:
  voice:
    description: Voice chat main command.
    usage: /voice <connect|reconnect|disconnect|bind|bindfake|reload>
    permission: voice.cmd

permissions:
  voice.cmd:
    default: true
  voice.connect:
    default: op
  voice.reconnect:
    default: op
  voice.disconnect:
    default: op
  voice.bind:
    default: true
  voice.bindfake:
    default: op
  voice.reload:
    default: op
