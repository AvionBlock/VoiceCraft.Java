plugins {
    id 'com.gradleup.shadow' version '9.4.3'
}

description = 'Paper adapter for VoiceCraft.Java.'
def pluginVersion = project.version.toString()

dependencies {
    implementation project(':core')
    implementation project(':adapter-api')
    implementation 'com.google.code.gson:gson:2.13.2'
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.20'
    compileOnly 'su.plo.voice.api:server:2.1.15'
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    compileOnly("io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT")
    compileOnly('org.projectlombok:lombok:1.18.44')
    annotationProcessor('org.projectlombok:lombok:1.18.44')
}

processResources {
    inputs.properties([
        name       : rootProject.ext.pluginName,
        version    : pluginVersion,
        description: rootProject.description,
        url        : rootProject.ext.pluginUrl,
        author     : rootProject.ext.pluginAuthor
    ])

    filesMatching('plugin.yml') {
        expand(
            name: rootProject.ext.pluginName,
            version: pluginVersion,
            description: rootProject.description,
            url: rootProject.ext.pluginUrl,
            author: rootProject.ext.pluginAuthor
        )
    }
}

tasks.jar {
    archiveBaseName.set("${rootProject.ext.pluginName}-paper")
    archiveClassifier.set('thin')
}

tasks.shadowJar {
    archiveBaseName.set("${rootProject.ext.pluginName}-paper")
    archiveClassifier.set('')
}

tasks.build {
    dependsOn tasks.shadowJar
}

tasks.register('verifyPluginMetadata') {
    dependsOn tasks.processResources
    def metadataFile = layout.buildDirectory.file('resources/main/plugin.yml')
    inputs.file(metadataFile)
    inputs.property('expectedVersion', pluginVersion)

    doLast {
        def metadata = metadataFile.get().asFile.text
        if (!metadata.contains("version: ${pluginVersion}")) {
            throw new GradleException("Paper plugin.yml version does not match ${pluginVersion}.")
        }
    }
}

tasks.check {
    dependsOn tasks.verifyPluginMetadata
}
