name: VoiceCraft.Java
version: ${version}
main: team.avion.bungeecord.VoiceCraftJava
description: VoiceCraft.Java — the ultimate cross-client proximity voice chat plugin connecting VoiceCraft, Simple Voice Chat, and Plasmo Voice across Java and Bedrock.
author: lil-jon-crunk
website: https://java.voicecraft.chat

commands:
  voice:
    permission: voice.cmd

permissions:
  voice.cmd:
    default: true
  voice.connect:
    default: op
  voice.reconnect:
    default: op
  voice.disconnect:
    default: op
  voice.bind:
    default: true
  voice.bindfake:
    default: op
  voice.reload:
    default: op
