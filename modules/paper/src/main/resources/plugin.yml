name: VoiceCraft.Java

version: ${version}

main: team.avion.paper.VoiceCraftJava
description: Java-side VoiceCraft bridge with Paper adapters, proxy networking, and managed runtime support.

author: lil-jon-crunk
website: https://java.voicecraft.chat

api-version: "1.21.11"
prefix: VoiceCraft.Java

softdepend:
  - PlaceholderAPI

commands:
  voice:
    description: Voice chat main command.
    usage: /voice <connect|reconnect|disconnect|bind|bindfake|reload>
    permission: voice.cmd

permissions:
  voice.cmd:
    default: true
  voice.connect:
    default: op
  voice.reconnect:
    default: op
  voice.disconnect:
    default: op
  voice.bind:
    default: true
  voice.bindfake:
    default: op
  voice.reload:
    default: op
