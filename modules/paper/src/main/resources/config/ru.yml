config-version: 6 # НЕ ТРОГАТЬ: используется для автоматических миграций конфига

config:
  debug: false # Включить дополнительное логирование
  lang: "system" # system, en, ru, nl, ja
  auto-reconnect: true # Переподключаться к VoiceCraft после потери соединения

  proxy:
    enabled: false # Включить, если этот Paper-сервер стоит за Velocity/Bungee

  adapters:
    plasmo:
      enabled: false # Включить совместимость с клиентом Plasmo Voice
      bind-host: "0.0.0.0" # UDP-адрес для Plasmo-клиентов
      port: 24454 # UDP-порт для Plasmo-клиентов
      public:
        host: "0.0.0.0" # Plasmo использует Minecraft-хост при 0.0.0.0; за Velocity/Bungee укажите хост прокси
        port: 0 # Порт для Plasmo клиентов; 0 использует UDP-порт выше, либо укажите proxy relay port
    simple-voice-chat:
      enabled: false # Включить совместимость с клиентом Simple Voice Chat
      bind-host: "0.0.0.0" # UDP-адрес для клиентов Simple Voice Chat
      port: 24455 # UDP-порт для клиентов Simple Voice Chat
      public:
        host: "" # Voice host для клиентов; за Velocity/Bungee укажите хост прокси
        port: 0 # Порт для клиентов; 0 использует UDP-порт выше, либо укажите proxy relay port
      compatibility-version: 20 # Версия совместимости Simple Voice Chat
      mtu-size: 1024 # Максимальный размер входящего Opus-пакета
      keep-alive-ms: 1000 # Интервал UDP keep-alive
      allow-recording: true # Сообщать клиентам, что запись разрешена

  voicecraft:
    transport:
      host: "127.0.0.1" # TCP-хост VoiceCraft
      port: 9050 # TCP-порт VoiceCraft
      login-token: "__GENERATED_LOGIN_TOKEN__" # LoginToken сервера VoiceCraft
    voice:
      port: 1111 # Порт голосового сервера VoiceCraft
    auto-start: true # Автоматически запускать управляемый VoiceCraft
    shutdown-on-disable: true # Останавливать VoiceCraft при выключении плагина
    invariant-globalization: true # Запускать .NET без системных ICU-библиотек
    ready-timeout-ms: 10000 # Сколько ждать запуска VoiceCraft
    install-directory: "voicecraft-runtime" # Папка для скачанных бинарников VoiceCraft

  voice:
    proximity-distance: 30 # Максимальная дистанция голоса
    proximity-toggle: true # Включить обработку proximity
    voice-effects: true # Включить эффекты пещеры и воды

    send-voicecraft-disconnect-message: true # Show a message when the VoiceCraft connection closes
    send-connection-lost-message: true # Show a message when the VoiceCraft connection is lost
    position-update-interval-ticks: 5 # Интервал обновления позиций в тиках
    cave-scan-interval-ms: 1000 # Минимальный интервал пересчета cave-фактора одного игрока
    cave-scans-per-update: 2 # Максимум тяжелых cave-сканирований за одно обновление позиций
