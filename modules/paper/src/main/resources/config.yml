config-version: 9 # DO NOT EDIT: used for automatic config migrations

config:
  debug: false
  lang: "system"
  auto-reconnect: true

  proxy:
    enabled: false

  adapters:
    client-priority: ["simple-voice-chat", "plasmo"]
    managed-dependencies:
      enabled: true
    native-configs:
      owner: "voicecraft" # voicecraft: manage ports below; native: keep each voice mod's own config
      simple-voice-chat:
        bind-address: ""
        bind-port: 24454
        advertised-host: ""
        advertised-port: 24454
      plasmo:
        bind-address: "0.0.0.0"
        bind-port: 0
        advertised-host: "0.0.0.0"
        advertised-port: 0
    plasmo:
      enabled: false
      install:
        enabled: true
    simple-voice-chat:
      enabled: false
      install:
        enabled: true

  voicecraft:
    transport:
      host: "127.0.0.1"
      port: 9050
      login-token: "__GENERATED_LOGIN_TOKEN__"
    voice:
      port: 9050
    auto-start: true
    shutdown-on-disable: true
    invariant-globalization: true
    ready-timeout-ms: 20000
    install-directory: "voicecraft-runtime"

  voice:
    proximity-distance: 30
    proximity-toggle: true
    voice-effects: true

    vanilla-status-overlay:
      enabled: true
      update-interval-ticks: 5
      handshake-grace-ticks: 60
      speaking-hold-ms: 600
      height-offset: 2.55
      view-distance: 48
      symbols:
        disconnected: "×"
        connected: "○"
        speaking: "●"
        muted: "M"
        deafened: "D"
      colors:
        disconnected: "dark_gray"
        connected: "gray"
        speaking: "green"
        muted: "red"
        deafened: "yellow"

    send-voicecraft-disconnect-message: true # Show a message when the VoiceCraft connection closes
    send-connection-lost-message: true # Show a message when the VoiceCraft connection is lost
    position-update-interval-ticks: 5
    cave-scan-interval-ms: 1000
    cave-scans-per-update: 2
