pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}

rootProject.name = 'VoiceCraft.Java'
include 'core'
include 'adapter-api'
include 'adapter-plasmo-protocol'
include 'adapter-simplevoicechat-protocol'
include 'paper'
include 'fabric'
include 'velocity'
include 'bungeecord'

project(':core').projectDir = file('modules/core')
project(':adapter-api').projectDir = file('modules/adapter-api')
project(':adapter-plasmo-protocol').projectDir = file('modules/adapter-plasmo-protocol')
project(':adapter-simplevoicechat-protocol').projectDir = file('modules/adapter-simplevoicechat-protocol')
project(':paper').projectDir = file('modules/paper')
project(':fabric').projectDir = file('modules/fabric')
project(':velocity').projectDir = file('modules/velocity')
project(':bungeecord').projectDir = file('modules/bungeecord')
