config-version: 7 # NIET AANPASSEN: gebruikt voor automatische configmigraties

config:
  debug: false # Extra debuglogging inschakelen
  lang: "system" # system, en, ru, nl, ja
  auto-reconnect: true # Opnieuw verbinden met VoiceCraft na verbindingsverlies

  proxy:
    enabled: false # Inschakelen als deze Paper-server achter Velocity/Bungee staat

  adapters:
    plasmo:
      enabled: false # Plasmo Voice-clientcompatibiliteit inschakelen
      bind-host: "0.0.0.0" # UDP-bindadres voor Plasmo-clients
      port: 24454 # UDP-poort voor Plasmo-clients
      public:
        host: "0.0.0.0" # Plasmo gebruikt bij 0.0.0.0 de Minecraft-host; gebruik de proxy-host achter Velocity/Bungee
        port: 0 # Poort voor Plasmo clients; 0 gebruikt de UDP-poort hierboven, of zet proxy relay-poort
    simple-voice-chat:
      enabled: false # Simple Voice Chat-clientcompatibiliteit inschakelen
      bind-host: "0.0.0.0" # UDP-bindadres voor Simple Voice Chat-clients
      port: 24455 # UDP-poort voor Simple Voice Chat-clients
      public:
        host: "" # Voice host voor clients; gebruik de proxy host achter Velocity/Bungee
        port: 0 # Poort voor clients; 0 gebruikt de UDP-poort hierboven, of zet proxy relay-poort
      compatibility-version: 20 # Simple Voice Chat-compatibiliteitsversie
      mtu-size: 1024 # Maximale inkomende Opus-payload
      keep-alive-ms: 1000 # UDP keep-alive-interval
      allow-recording: true # Vertel clients of opnemen is toegestaan

  voicecraft:
    transport:
      host: "127.0.0.1" # VoiceCraft TCP-host
      port: 9050 # VoiceCraft TCP-poort
      login-token: "__GENERATED_LOGIN_TOKEN__" # VoiceCraft LoginToken
    voice:
      port: 1111 # Managed VoiceCraft voice port
    auto-start: true # Beheerde VoiceCraft automatisch starten
    shutdown-on-disable: true # VoiceCraft stoppen als de plugin uitschakelt
    invariant-globalization: true # .NET draaien zonder systeem-ICU-pakketten
    ready-timeout-ms: 20000 # Hoe lang op het opstarten van VoiceCraft wachten
    install-directory: "voicecraft-runtime" # Map voor gedownloade VoiceCraft binaries

  voice:
    proximity-distance: 30 # Maximale spraakafstand
    proximity-toggle: true # Proximity-verwerking inschakelen
    voice-effects: true # Grot- en watereffecten inschakelen

    vanilla-status-overlay:
      enabled: true # Toon statussen alleen tussen spelers zonder SVC of Plasmo
      update-interval-ticks: 5 # Interval voor positie- en zichtbaarheidsupdates
      handshake-grace-ticks: 60 # Wacht op modkanalen voordat een client als vanilla geldt
      speaking-hold-ms: 600 # Houd de spreekstatus vast na het laatste audioframe
      height-offset: 2.55 # Hoogte van het hologram boven de voeten
      view-distance: 48 # Maximale zichtafstand
      symbols:
        disconnected: "×"
        connected: "○"
        speaking: "●"
        muted: "M"
        deafened: "D"
      colors:
        disconnected: "dark_gray"
        connected: "gray"
        speaking: "green"
        muted: "red"
        deafened: "yellow"

    send-voicecraft-disconnect-message: true # Show a message when the VoiceCraft connection closes
    send-connection-lost-message: true # Show a message when the VoiceCraft connection is lost
    position-update-interval-ticks: 5 # Positie-update-interval in ticks
    cave-scan-interval-ms: 1000 # Minimale tijd voor een nieuwe grotmeting per speler
    cave-scans-per-update: 2 # Maximum aantal zware grotmetingen per positie-update
