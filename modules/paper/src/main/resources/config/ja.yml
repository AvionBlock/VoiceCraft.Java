config-version: 9 # 編集しないでください: configの自動移行に使用されます

config:
  debug: false # 追加のデバッグログを有効化します
  lang: "system" # system, en, ru, nl, ja
  auto-reconnect: true # 切断時に VoiceCraft へ再接続します

  proxy:
    enabled: false # この Paper サーバーが Velocity/Bungee 配下なら有効化します

  adapters:
    client-priority: ["simple-voice-chat", "plasmo"]
    managed-dependencies:
      enabled: true
    native-configs:
      owner: "voicecraft"
      simple-voice-chat:
        bind-address: ""
        bind-port: 24454
        advertised-host: ""
        advertised-port: 24454
      plasmo:
        bind-address: "0.0.0.0"
        bind-port: 0
        advertised-host: "0.0.0.0"
        advertised-port: 0
    plasmo:
      enabled: false # 公式 Plasmo Voice を VoiceCraft に接続
      install:
        enabled: true
    simple-voice-chat:
      enabled: false # 公式 Simple Voice Chat を VoiceCraft に接続
      install:
        enabled: true

  voicecraft:
    transport:
      host: "127.0.0.1" # VoiceCraft の TCP ホスト
      port: 9050 # VoiceCraft の TCP ポート
      login-token: "__GENERATED_LOGIN_TOKEN__" # VoiceCraft の LoginToken
    voice:
      port: 9050 # VoiceCraft の公開 UDP ボイスポート
    auto-start: true # 管理対象 VoiceCraft を自動起動します
    shutdown-on-disable: true # プラグイン停止時に VoiceCraft を終了します
    invariant-globalization: true # システム ICU なしで .NET を実行します
    ready-timeout-ms: 20000 # VoiceCraft 起動待ち時間
    install-directory: "voicecraft-runtime" # VoiceCraft バイナリの保存先

  voice:
    proximity-distance: 30 # ボイスの最大距離
    proximity-toggle: true # 距離ベース処理を有効化します
    voice-effects: true # 洞窟/水中エフェクトを有効化します

    vanilla-status-overlay:
      enabled: true # SVC/Plasmoを使用しないプレイヤー間だけで状態を表示します
      update-interval-ticks: 5 # 位置と表示状態の更新間隔
      handshake-grace-ticks: 60 # vanilla判定前にmodチャンネルを待つ時間
      speaking-hold-ms: 600 # 最後の音声フレーム後に発話状態を維持する時間
      height-offset: 2.55 # プレイヤーの足元からの表示高さ
      view-distance: 48 # 最大表示距離
      symbols:
        disconnected: "×"
        connected: "○"
        speaking: "●"
        muted: "M"
        deafened: "D"
      colors:
        disconnected: "dark_gray"
        connected: "gray"
        speaking: "green"
        muted: "red"
        deafened: "yellow"

    send-voicecraft-disconnect-message: true # Show a message when the VoiceCraft connection closes
    send-connection-lost-message: true # Show a message when the VoiceCraft connection is lost
    position-update-interval-ticks: 5 # 位置更新間隔（tick）
    cave-scan-interval-ms: 1000 # プレイヤーごとの洞窟係数を再計算する最小間隔
    cave-scans-per-update: 2 # 位置更新ごとの重い洞窟スキャン上限
